<!DOCTYPE html>
  <html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    
        <!-- Bootstrap JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Marck+Script&family=Momo+Trust+Display&family=Momo+Trust+Sans:wght@200..800&display=swap" rel="stylesheet">

        
        <title>Welcome Page</title>
    </head>

    <body>
      <div class="container-fluid vh-100">
      <div class="row h-100">

        <!-- Left Column -->
        <div id = "leftside" class="col-md-6 d-flex flex-column justify-content-center align-items-center text-center">
          <h1 class= "welcome">Welcome</h1>
          <br>
          <h3>Login or Sign Up</h3>
          <br>
          <br>
          <button class="btn login m-2" onclick="showLogin()">Login</button>
          <button class="btn m-2" onclick = "showCreateAccount()">Sign Up</button>
        </div>

        <!-- Right Column -->
        <div class="col-md-6 rightside text-center position-relative d-flex justify-content-center align-items-center">
          <img src="clipboard.png" class="img-behind">
          <div>
            <h1>BearcatResume</h1>
            <br>
            <h3>Fine-tune and build your resume with AI</h3>
          </div>
        </div>
      </div>
      </div>

      <script>
        function showLogin() {
          const left = document.getElementById('leftside');
          left.innerHTML = `
           <div class="form-container d-flex flex-column align-items-center">
            <h1 class= "welcome">Welcome</h1>
            <br>
            <h3>Login with b-mail</h3>
            <br>
            <form>
              <input type="text" placeholder="B-mail" class="enter-info form-control mb-2">
              <input type="password" placeholder="Password" class="enter-info form-control mb-2">
              <button type="submit" class="btn btn-primary">Login</button>
            </form>
            </div>
          `;
        }

        function showCreateAccount() {
          const left = document.getElementById('leftside');
          left.innerHTML = `
           <div class="form-container d-flex flex-column align-items-center">
            <h1 class= "welcome">Welcome</h1>
            <br>
            <h3>Create an account using your b-mail</h3>
            <br>
            <form onsubmit="resumeUpload(); return false;">
              <input type="text" placeholder="B-mail" class="enter-info form-control mb-2">
              <input type="password" placeholder="Password" class="enter-info form-control mb-2">
              <button type="submit" class="btn">Sign Up</button>
            </form>
            </div>
          `;
        }

        function resumeUpload(){
          document.body.innerHTML = `
            <div id = "main-container" class="d-flex flex-column justify-content-center align-items-center vh-100 bg-light text-center">
              <h3 class="mb-4">Upload existing resume or add details manually</h3>

              <div class="choose d-flex justify-content-center align-items-center gap-3">
                  <button class="btn">Upload Resume</button>
                  <span class="align-middle">or</span>
                  <a href="input.html" class="btn">Add Manually</a>
              </div>
            </div>
          `;
        }
      </script>

    </body>
  </html>
